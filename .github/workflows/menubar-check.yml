# Fork-only: checks the Handy Bar menu bar code on macOS. Upstream's own
# workflows need Handy's signing secrets, so this is the fork's CI.
name: Handy Bar check

on:
  push:
    branches: [menubar-native]
  pull_request:
    branches: [menubar-native]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  menubar:
    if: github.repository != 'cjpais/handy'
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri
      - name: Formatting
        working-directory: src-tauri
        run: rustfmt --check --edition 2021 src/menubar/*.rs
      - name: Menu bar tests
        working-directory: src-tauri
        env:
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"
        run: |
          mkdir -p ../dist
          cargo test --lib menubar
